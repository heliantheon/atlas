# Generated by cicd-harness. Extend Hephaestus instead of adding local steps.
name: Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: heliannuuthus/hephaestus/.github/workflows/ci-frontend.yml@main
    permissions:
      contents: read
    with:
      workdir: './'
      node-version: '24.13.x'
      build: 'build'
      type-check: 'type-check'

  containerize:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci]
    uses: heliannuuthus/hephaestus/.github/workflows/ci-containerize-source.yml@main
    permissions:
      contents: read
      packages: write
    with:
      manifest: '.hephaestus/containers.json'
      version: '${{ needs.ci.outputs.version }}'

  promote:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci, containerize]
    uses: heliannuuthus/hephaestus/.github/workflows/ci-promote-gitops.yml@main
    permissions:
      contents: read
    with:
      version: '${{ needs.ci.outputs.version }}'
      updates: |
        atlas/overlay/release-portal.yaml=ghcr.io/heliantheon/atlas-portal
        atlas/overlay/release-hermes.yaml=ghcr.io/heliantheon/atlas-hermes
    secrets:
      gitops_token: '${{ secrets.GITOPS_TOKEN }}'
