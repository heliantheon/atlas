apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas-hermes
  labels:
    app.kubernetes.io/name: atlas-hermes
    app.kubernetes.io/part-of: heliantheon
spec:
  ingressClassName: traefik
  rules:
    - host: hermes.heliannuuthus.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atlas-hermes
                port:
                  name: http
