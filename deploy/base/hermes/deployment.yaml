apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-ui
  labels:
    app.kubernetes.io/name: hermes-ui
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: heliantheon
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-ui
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: heliantheon
    spec:
      serviceAccountName: hermes-ui
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hermes-ui
          image: ghcr.io/heliantheons/hermes-ui:unreleased
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
            - {name: nginx-run, mountPath: /var/run}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        - name: nginx-cache
          emptyDir: {sizeLimit: 64Mi}
        - name: nginx-run
          emptyDir: {sizeLimit: 8Mi}
